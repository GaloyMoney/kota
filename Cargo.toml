[workspace]
resolver = "2"
members = ["core/coordination", "kota/app", "kota/server", "kota/cli"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
es-entity = { version = "0.11.11", features = [
    "event-context",
    "tracing-context",
    "instrument",
] }
job = { version = "0.6.36", features = ["es-entity"] }
async-trait = "0.1"
bitcoin = { version = "0.32", features = ["serde", "base64"] }
miniscript = { version = "13", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.43", features = ["clock", "serde"] }
thiserror = "2.0.18"
derive_builder = "0.20.0"
uuid = { version = "1.23", features = ["serde", "v4"] }
strum = { version = "0.28", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }
sha2 = "0.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# async-graphql rc pin must stay unified with es-entity's optional
# dependency (8.0.0-rc.5) so the `scalar!` impls it generates for the
# entity ids apply to the same async-graphql version the server uses.
async-graphql = { version = "8.0.0-rc.5", default-features = false }
async-graphql-axum = "8.0.0-rc.5"
axum = "0.8"
tokio = { version = "1.52", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "net",
    "sync",
] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
base64 = "0.22"
