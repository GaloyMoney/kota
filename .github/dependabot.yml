version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Galoy-internal crate; version bumps are coordinated manually since
      # breaking changes affect entity/repo code across the workspace.
      - dependency-name: "es-entity*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns:
          - "*"
